<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Robly - on a call">
<defs>
  <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e4ecfb"/>
  </linearGradient>
  <radialGradient id="headSheen" cx="0.32" cy="0.22" r="0.75">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141b2d"/>
    <stop offset="1" stop-color="#04070d"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#bff4ff"/>
    <stop offset="0.45" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#3b82f6"/>
  </radialGradient>
  <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="0.7" stop-color="#38bdf8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloveGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b3040"/>
    <stop offset="1" stop-color="#12141d"/>
  </linearGradient>
  <linearGradient id="phoneScreen" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#60a5fa"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dropShadow" x="-50%" y="-30%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.22"/>
  </filter>
</defs>
<style>
.robot-anim{transform-origin:250px 350px;animation:robotFloat 3.2s ease-in-out infinite}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.base-ring{transform-origin:250px 424px;animation:ringPulse 3.2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.antenna-halo{transform-origin:250px 36px;animation:haloPulse 1.6s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.25);opacity:1}}
.eyes{transform-origin:250px 190px;animation:blink 4.6s ease-in-out infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
.mouth{transform-origin:250px 218px;animation:talk .42s ease-in-out infinite}
@keyframes talk{0%{transform:scaleY(.35)}25%{transform:scaleY(1)}50%{transform:scaleY(.5)}75%{transform:scaleY(1.1)}100%{transform:scaleY(.35)}}
/* Head tilts slightly toward the phone, like cradling a call */
.head-tilt{transform-origin:250px 290px;animation:tilt 3.2s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(2deg)}50%{transform:rotate(3.5deg)}}
.arm-r{transform-origin:345px 318px;animation:hold 3.2s ease-in-out infinite}
@keyframes hold{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.5deg)}}
.arm-l{transform-origin:155px 315px;animation:gesture 1.6s ease-in-out infinite}
@keyframes gesture{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
.wave{opacity:0;animation:wave 1.5s ease-out infinite}
.w2{animation-delay:.25s}
.w3{animation-delay:.5s}
@keyframes wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.screen-glow{animation:screen 1.5s ease-in-out infinite}
@keyframes screen{0%,100%{opacity:.75}50%{opacity:1}}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.2s ease-in-out infinite}
.d2{animation-delay:.15s}
.d3{animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.bubble{transform-origin:70px 90px;animation:bubble 3.2s ease-in-out infinite}
@keyframes bubble{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>

<g class="base-ring">
  <ellipse cx="250" cy="424" rx="128" ry="30" fill="url(#ringGlow)"/>
  <ellipse cx="250" cy="424" rx="108" ry="15" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.55"/>
  <ellipse cx="250" cy="420" rx="76" ry="9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
</g>

<!-- Speech bubble with an API hint: "{ }" + typing dots -->
<g class="bubble">
  <path d="M96 92 Q108 108 122 116 Q104 112 86 100 Z" fill="#ffffff" stroke="#c7d2fe" stroke-width="3" stroke-linejoin="round"/>
  <rect x="14" y="36" width="112" height="62" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="3" filter="url(#dropShadow)"/>
  <text x="36" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="24" font-weight="700" fill="url(#accentGrad)">{</text>
  <circle class="dot" cx="58" cy="68" r="4.5" fill="url(#accentGrad)"/>
  <circle class="dot d2" cx="71" cy="68" r="4.5" fill="url(#accentGrad)"/>
  <circle class="dot d3" cx="84" cy="68" r="4.5" fill="url(#accentGrad)"/>
  <text x="96" y="76" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="24" font-weight="700" fill="url(#accentGrad)">}</text>
</g>

<g class="robot-anim">
  <g class="robot">
    <g class="torso-group">
      <rect x="163" y="300" width="174" height="122" rx="50" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
      <rect x="216" y="326" width="68" height="68" rx="18" fill="url(#accentGrad)"/>
      <rect x="216" y="326" width="68" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
      <text x="250" y="374" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="46" font-weight="700" fill="white">R</text>
    </g>

    <g class="head-tilt">
      <g class="antenna">
        <rect x="244" y="46" width="12" height="26" rx="6" fill="#2b3040"/>
        <circle cx="250" cy="36" r="20" fill="url(#ringGlow)" class="antenna-halo"/>
        <circle cx="250" cy="36" r="13" fill="url(#sphereGrad)" filter="url(#glow)"/>
        <circle cx="245" cy="31" r="3.6" fill="#ffffff" opacity="0.9"/>
      </g>
      <g class="ears">
        <rect x="85" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
        <rect x="385" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
        <rect x="91" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
        <rect x="391" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
      </g>
      <g class="head-group">
        <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
        <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#headSheen)"/>
        <rect x="132" y="93" width="236" height="160" rx="62" fill="url(#visorGrad)"/>
        <rect x="132" y="93" width="236" height="160" rx="62" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
        <g class="eyes" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
          <path d="M172 186 Q198 160 224 186"/>
          <path d="M276 186 Q302 160 328 186"/>
        </g>
        <g class="mouth">
          <rect x="222" y="211" width="56" height="14" rx="7" fill="url(#cyanGrad)" filter="url(#glow)"/>
        </g>
      </g>
    </g>

    <!-- Left arm: relaxed, gesturing a little while talking -->
    <g class="arm-l">
      <rect x="134.0" y="315.0" width="42" height="56.6" rx="21.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(20.7 155.0 315.0)"/>
      <rect x="138.3" y="308.5" width="33.4" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(20.7 155.0 315.0)"/>
      <rect x="117.0" y="368.0" width="36" height="51.7" rx="18.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(14.6 135.0 368.0)"/>
      <rect x="120.4" y="361.5" width="29.2" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(14.6 135.0 368.0)"/>
      <g transform="rotate(14.6 122.0 418.0)"><rect x="105.4" y="418.9" width="7.4" height="12.9" rx="3.7" fill="url(#gloveGrad)" transform="rotate(-24 109.1 419.8)"/><rect x="111.0" y="415.2" width="22.1" height="18.4" rx="8.3" fill="url(#gloveGrad)"/><rect x="109.7" y="430.0" width="6.3" height="13.8" rx="3.1" fill="url(#gloveGrad)"/><rect x="118.9" y="430.0" width="6.3" height="15.6" rx="3.1" fill="url(#gloveGrad)"/><rect x="128.1" y="430.0" width="6.3" height="13.8" rx="3.1" fill="url(#gloveGrad)"/></g>
    </g>

    <!-- Right arm: shoulder (345,318) -> elbow (440,292) -> wrist (430,222),
         each segment rotated by atan2(dy,dx)-90 so it lies along that line;
         the hand holds the phone against the right ear. -->
    <g class="arm-r">
      <rect x="324.0" y="318.0" width="42" height="98.5" rx="21.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(-105.3 345.0 318.0)"/>
      <rect x="328.3" y="311.5" width="33.4" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(-105.3 345.0 318.0)"/>
      <rect x="423.0" y="292.0" width="34" height="70.7" rx="17.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(171.9 440.0 292.0)"/>
      <rect x="426.1" y="285.5" width="27.8" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(171.9 440.0 292.0)"/>

      <!-- Phone, tilted so the speaker sits on the ear and the mic points to the mouth -->
      <g transform="rotate(14 420 172)" filter="url(#dropShadow)">
        <rect x="397" y="122" width="46" height="100" rx="12" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="3"/>
        <rect class="screen-glow" x="402" y="133" width="36" height="78" rx="7" fill="url(#phoneScreen)"/>
        <rect x="413" y="126.5" width="14" height="3" rx="1.5" fill="#94a3b8"/>
        <!-- call icon on the screen -->
        <g transform="translate(410 146) scale(1.25)">
          <path d="M0 2 q2 -3 5 0 l2 3 q1 2 -1 3 q2 5 7 7 q1 -2 3 -1 l3 2 q3 3 0 5 q-4 4 -12 -2 q-8 -7 -7 -17 z" fill="#ffffff" opacity="0.95"/>
        </g>
      </g>

      <!-- Hand gripping the lower half of the phone (back of the glove toward the viewer) -->
      <g transform="rotate(14 413 200)">
        <rect x="389" y="187" width="11" height="8" rx="4" fill="url(#gloveGrad)"/>
        <rect x="388" y="196" width="12" height="8" rx="4" fill="url(#gloveGrad)"/>
        <rect x="389" y="205" width="11" height="8" rx="4" fill="url(#gloveGrad)"/>
        <rect x="396" y="184" width="36" height="32" rx="11" fill="url(#gloveGrad)"/>
        <rect x="427" y="178" width="10" height="18" rx="5" fill="url(#gloveGrad)" transform="rotate(-18 432 187)"/>
        <rect x="402" y="189" width="20" height="4" rx="2" fill="#ffffff" opacity="0.14"/>
      </g>
    </g>
  </g>

  <!-- Sound waves coming out of the phone -->
  <g fill="none" stroke="url(#cyanGrad)" stroke-width="5" stroke-linecap="round">
    <path class="wave" d="M452 106 Q463 119 456 134"/>
    <path class="wave w2" d="M464 92 Q481 116 470 142"/>
    <path class="wave w3" d="M476 78 Q497 113 484 150"/>
  </g>
</g>
</svg>
