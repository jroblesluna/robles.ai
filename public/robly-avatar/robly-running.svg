<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -5 520 520" width="500" height="500" role="img" aria-label="Robly - running">
<defs>
  <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e4ecfb"/>
  </linearGradient>
  <radialGradient id="headSheen" cx="0.32" cy="0.22" r="0.75">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141b2d"/>
    <stop offset="1" stop-color="#04070d"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#bff4ff"/>
    <stop offset="0.45" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#3b82f6"/>
  </radialGradient>
  <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="0.7" stop-color="#38bdf8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#1e293b" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#1e293b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloveGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b3040"/>
    <stop offset="1" stop-color="#12141d"/>
  </linearGradient>
  <linearGradient id="speedGrad" gradientUnits="userSpaceOnUse" x1="120" y1="0" x2="15" y2="0">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dropShadow" x="-50%" y="-30%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.22"/>
  </filter>
</defs>
<style>
/* One stride = 0.6 s: the body bounces twice (once per foot contact). */
.bounce{transform-origin:250px 480px;animation:bounce .6s ease-in-out infinite}
@keyframes bounce{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(-12px)}}
.ground-shadow{transform-origin:250px 490px;animation:shadow .6s ease-in-out infinite}
@keyframes shadow{0%,50%,100%{transform:scaleX(1);opacity:1}25%,75%{transform:scaleX(.82);opacity:.65}}
.head-bob{transform-origin:250px 280px;animation:headBob .6s ease-in-out infinite}
@keyframes headBob{0%,50%,100%{transform:rotate(1.5deg)}25%,75%{transform:rotate(-1deg)}}
.antenna-wobble{transform-origin:250px 72px;animation:wobble .3s ease-in-out infinite alternate}
@keyframes wobble{from{transform:rotate(-10deg)}to{transform:rotate(2deg)}}
.antenna-halo{transform-origin:250px 36px;animation:haloPulse 1.2s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.2);opacity:.95}}
.eyes{transform-origin:250px 186px;animation:blink 4s ease-in-out infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
/* Speed lines trail behind (left), dust kicks up at the heels. */
.speed{animation:speed .7s linear infinite;opacity:0}
.s2{animation-delay:-.2s}.s3{animation-delay:-.45s}.s4{animation-delay:-.1s}.s5{animation-delay:-.55s}
@keyframes speed{0%{transform:translateX(40px);opacity:0}25%{opacity:.9}100%{transform:translateX(-60px);opacity:0}}
.dust{transform-box:fill-box;transform-origin:center;animation:dust .6s ease-out infinite;opacity:0}
.d2{animation-delay:-.3s}.d3{animation-delay:-.15s}
@keyframes dust{0%{transform:translate(0,0) scale(.4);opacity:.55}100%{transform:translate(-46px,-14px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .bounce,.ground-shadow,.head-bob,.antenna-wobble,.antenna-halo,.eyes,.speed,.dust{animation:none}
}
</style>

<!-- Ground -->
<ellipse class="ground-shadow" cx="250" cy="490" rx="120" ry="14" fill="url(#shadowGrad)"/>
<ellipse cx="250" cy="492" rx="150" ry="3" fill="url(#ringGlow)" opacity="0.8"/>

<!-- Speed lines -->
<g stroke="url(#speedGrad)" stroke-linecap="round" fill="none">
  <path class="speed s1" d="M40 200 H120" stroke-width="6"/>
  <path class="speed s2" d="M18 262 H110" stroke-width="8"/>
  <path class="speed s3" d="M46 318 H116" stroke-width="5"/>
  <path class="speed s4" d="M24 380 H104" stroke-width="7"/>
  <path class="speed s5" d="M60 150 H118" stroke-width="4"/>
</g>

<!-- Dust at the heels -->
<g fill="#cbd5e1">
  <circle class="dust d1" cx="196" cy="478" r="10"/>
  <circle class="dust d2" cx="226" cy="482" r="8"/>
  <circle class="dust d3" cx="180" cy="484" r="6"/>
</g>

<!-- Robot: leaning forward (running to the right) -->
<g transform="rotate(6 250 480)">
  <g class="bounce">

    <!-- Legs (behind the torso). Rotation happens around the hip; the shin bends at the knee on the back swing. -->
    <g transform="translate(222 404)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="32;-30;32" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect x="-15" y="-6" width="30" height="46" rx="15" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
        <g transform="translate(0 34)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="55;6;6;55" keyTimes="0;0.4;0.6;1" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;0 0 1 1;.4 0 .6 1"/>
            <rect x="-13" y="-5" width="26" height="10" rx="5" fill="url(#accentGrad)"/>
            <rect x="-14" y="2" width="28" height="30" rx="12" fill="url(#gloveGrad)"/>
            <rect x="-16" y="22" width="42" height="17" rx="8.5" fill="url(#gloveGrad)"/>
            <rect x="-9" y="25" width="22" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
          </g>
        </g>
      </g>
    </g>
    <g transform="translate(278 404)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="32;-30;32" keyTimes="0;0.5;1" dur="0.6s" begin="-0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect x="-15" y="-6" width="30" height="46" rx="15" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
        <g transform="translate(0 34)">
          <g>
            <animateTransform attributeName="transform" type="rotate" values="55;6;6;55" keyTimes="0;0.4;0.6;1" dur="0.6s" begin="-0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;0 0 1 1;.4 0 .6 1"/>
            <rect x="-13" y="-5" width="26" height="10" rx="5" fill="url(#accentGrad)"/>
            <rect x="-14" y="2" width="28" height="30" rx="12" fill="url(#gloveGrad)"/>
            <rect x="-16" y="22" width="42" height="17" rx="8.5" fill="url(#gloveGrad)"/>
            <rect x="-9" y="25" width="22" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
          </g>
        </g>
      </g>
    </g>

    <!-- Torso -->
    <g class="torso-group">
      <rect x="163" y="300" width="174" height="122" rx="50" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
      <rect x="216" y="326" width="68" height="68" rx="18" fill="url(#accentGrad)"/>
      <rect x="216" y="326" width="68" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
      <text x="250" y="374" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="46" font-weight="700" fill="white">R</text>
    </g>

    <!-- Arms: swing opposite to the legs, forearms bent forward, fists closed. -->
    <g transform="translate(172 330)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-26;34;-26" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect x="-17" y="-8" width="34" height="54" rx="17" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
        <rect x="-14" y="-10" width="28" height="12" rx="6" fill="url(#accentGrad)"/>
        <g transform="translate(0 40) rotate(-58)">
          <rect x="-15" y="-4" width="30" height="44" rx="15" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
          <rect x="-12" y="-6" width="24" height="11" rx="5.5" fill="url(#accentGrad)"/>
          <rect x="-14" y="34" width="28" height="24" rx="11" fill="url(#gloveGrad)"/>
        </g>
      </g>
    </g>
    <g transform="translate(328 330)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-26;34;-26" keyTimes="0;0.5;1" dur="0.6s" begin="-0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
        <rect x="-17" y="-8" width="34" height="54" rx="17" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
        <rect x="-14" y="-10" width="28" height="12" rx="6" fill="url(#accentGrad)"/>
        <g transform="translate(0 40) rotate(-58)">
          <rect x="-15" y="-4" width="30" height="44" rx="15" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2"/>
          <rect x="-12" y="-6" width="24" height="11" rx="5.5" fill="url(#accentGrad)"/>
          <rect x="-14" y="34" width="28" height="24" rx="11" fill="url(#gloveGrad)"/>
        </g>
      </g>
    </g>

    <!-- Head -->
    <g class="head-bob">
      <g class="antenna-wobble">
        <rect x="244" y="46" width="12" height="26" rx="6" fill="#2b3040"/>
        <circle cx="250" cy="36" r="20" fill="url(#ringGlow)" class="antenna-halo"/>
        <circle cx="250" cy="36" r="13" fill="url(#sphereGrad)" filter="url(#glow)"/>
        <circle cx="245" cy="31" r="3.6" fill="#ffffff" opacity="0.9"/>
      </g>
      <g class="ears">
        <rect x="85" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
        <rect x="385" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
        <rect x="91" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
        <rect x="391" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
      </g>
      <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
      <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#headSheen)"/>
      <rect x="132" y="93" width="236" height="160" rx="62" fill="url(#visorGrad)"/>
      <rect x="132" y="93" width="236" height="160" rx="62" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- Determined brows -->
      <path d="M176 150 L216 160" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <path d="M284 160 L324 150" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
      <g class="eyes" fill="none" stroke="url(#cyanGrad)" stroke-width="7" filter="url(#glow)">
        <rect x="172" y="172" width="52" height="28" rx="14"/>
        <rect x="276" y="172" width="52" height="28" rx="14"/>
        <!-- Pupils looking ahead, in the running direction -->
        <g fill="url(#cyanGrad)" stroke="none">
          <circle cx="208" cy="186" r="7"/>
          <circle cx="312" cy="186" r="7"/>
        </g>
      </g>
      <!-- Effort grin -->
      <path d="M222 224 Q250 242 278 224" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    </g>

  </g>
</g>
</svg>
