<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440"> <defs> <linearGradient id="bodyGradient" x1="0" y1="0" x2="0" y2="1"> <stop offset="0%" stop-color="#FFFFFF"/> <stop offset="55%" stop-color="#F1F4F8"/> <stop offset="100%" stop-color="#D9E0E8"/> </linearGradient> <linearGradient id="headGradient" x1="0" y1="0" x2="0" y2="1"> <stop offset="0%" stop-color="#FFFFFF"/> <stop offset="100%" stop-color="#E3E9EF"/> </linearGradient> <linearGradient id="visorGradient" x1="0" y1="0" x2="0" y2="1"> <stop offset="0%" stop-color="#16233D"/> <stop offset="100%" stop-color="#020712"/> </linearGradient> <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1"> <stop offset="0%" stop-color="#22E5D0"/> <stop offset="55%" stop-color="#3AD6A0"/> <stop offset="100%" stop-color="#A6FF4D"/> </linearGradient> <linearGradient id="accentGradientSoft" x1="0" y1="0" x2="1" y2="0"> <stop offset="0%" stop-color="#22E5D0" stop-opacity="0.9"/> <stop offset="100%" stop-color="#A6FF4D" stop-opacity="0.9"/> </linearGradient> <radialGradient id="eyeGlow" cx="50%" cy="45%" r="60%"> <stop offset="0%" stop-color="#DFFFF7"/> <stop offset="45%" stop-color="#3FF0D6"/> <stop offset="100%" stop-color="#12C7B0"/> </radialGradient> <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%"> <stop offset="0%" stop-color="#EAFFEF" stop-opacity="1"/> <stop offset="100%" stop-color="#7CFA5B" stop-opacity="0"/> </radialGradient>
<filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
  <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#12233F" flood-opacity="0.18"/>
</filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="3" result="blur"/>
  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
<filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="5"/>
</filter>
</defs> <g id="mascot">
<ellipse id="shadow" cx="200" cy="404" rx="98" ry="13" fill="#0B1A33" opacity="0.16" filter="url(#blurSoft)"/>

