<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <defs>
    <linearGradient id="bodyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F1F4F8"/>
      <stop offset="100%" stop-color="#D9E0E8"/>
    </linearGradient>
    <linearGradient id="headGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E3E9EF"/>
    </linearGradient>
    <linearGradient id="visorGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233D"/>
      <stop offset="100%" stop-color="#020712"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22E5D0"/>
      <stop offset="55%" stop-color="#3AD6A0"/>
      <stop offset="100%" stop-color="#A6FF4D"/>
    </linearGradient>
    <linearGradient id="accentGradientSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22E5D0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A6FF4D" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#DFFFF7"/>
      <stop offset="45%" stop-color="#3FF0D6"/>
      <stop offset="100%" stop-color="#12C7B0"/>
    </radialGradient>
    <radialGradient id="tipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFFEF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7CFA5B" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#12233F" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="chestLogoClip">
      <rect x="158" y="220" width="84" height="84" rx="20"/>
    </clipPath>
  </defs>

  <g id="mascot">

    <ellipse id="shadow" cx="200" cy="404" rx="98" ry="13" fill="#0B1A33" opacity="0.16" filter="url(#blurSoft)"/>

    <g id="legs">
      <rect x="153" y="344" width="34" height="46" rx="14" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
      <rect x="213" y="344" width="34" height="46" rx="14" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
      <ellipse cx="170" cy="392" rx="26" ry="8" fill="#E4E9EE" stroke="#C7D0DA" stroke-width="1.5"/>
      <ellipse cx="230" cy="392" rx="26" ry="8" fill="#E4E9EE" stroke="#C7D0DA" stroke-width="1.5"/>
    </g>

    <g id="arms">
      <g id="arm-right" stroke="url(#bodyGradient)" stroke-linecap="round" fill="none">
        <circle cx="273" cy="222" r="15" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
        <path d="M273,222 L302,254" stroke-width="22"/>
        <circle cx="302" cy="254" r="12" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
        <path d="M302,254 L336,246" stroke-width="17"/>
        <g id="hand-right">
          <circle cx="342" cy="244" r="14" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
          <rect x="352" y="238" width="26" height="11" rx="5.5" fill="url(#accentGradientSoft)"/>
        </g>
      </g>

      <g id="arm-left" stroke="url(#bodyGradient)" stroke-linecap="round" fill="none">
        <circle cx="127" cy="222" r="15" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
        <path d="M127,222 L99,176" stroke-width="22"/>
        <circle cx="99" cy="176" r="12" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
        <path d="M99,176 L114,134" stroke-width="17"/>
        <g id="hand-left">
          <circle cx="117" cy="126" r="15" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="1.5"/>
          <g stroke="url(#accentGradientSoft)" stroke-width="4" stroke-linecap="round">
            <path d="M105,110 L98,94"/>
            <path d="M116,105 L113,88"/>
            <path d="M128,109 L131,92"/>
          </g>
        </g>
      </g>
    </g>

    <g id="body" filter="url(#softShadow)">
      <rect x="120" y="192" width="160" height="150" rx="52" fill="url(#bodyGradient)" stroke="#C7D0DA" stroke-width="2"/>
      <rect x="138" y="204" width="124" height="30" rx="15" fill="#FFFFFF" opacity="0.55"/>

      <g id="chest-logo">
        <rect x="158" y="220" width="84" height="84" rx="20" fill="url(#accentGradient)"/>
        <rect x="158" y="220" width="84" height="28" rx="14" fill="#FFFFFF" opacity="0.18"/>
        <image
          x="158" y="220" width="84" height="84"
          clip-path="url(#chestLogoClip)"
          preserveAspectRatio="xMidYMid slice"
          href="data:image/png;base64,"
        />
        <rect x="158" y="220" width="84" height="84" rx="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
      </g>
    </g>

    <g id="head" filter="url(#softShadow)">
      <g id="antenna">
        <line x1="200" y1="70" x2="200" y2="44" stroke="#C7D0DA" stroke-width="5" stroke-linecap="round"/>
        <circle cx="200" cy="38" r="9" fill="url(#tipGlow)"/>
        <circle cx="200" cy="38" r="5" fill="url(#accentGradient)" filter="url(#glow)"/>
      </g>

      <g id="halo" opacity="0.55">
        <ellipse cx="200" cy="78" rx="86" ry="14" fill="none" stroke="url(#accentGradientSoft)" stroke-width="2.5" stroke-dasharray="4 7"/>
      </g>

      <rect x="128" y="72" width="144" height="122" rx="46" fill="url(#headGradient)" stroke="#C7D0DA" stroke-width="2"/>

      <g id="visor">
        <rect x="150" y="108" width="100" height="56" rx="26" fill="url(#visorGradient)"/>
        <g id="eyes">
          <ellipse cx="178" cy="136" rx="11" ry="13" fill="url(#eyeGlow)" filter="url(#glow)"/>
          <ellipse cx="222" cy="136" rx="11" ry="13" fill="url(#eyeGlow)" filter="url(#glow)"/>
        </g>
        <path d="M182,154 Q200,164 218,154" fill="none" stroke="#3FF0D6" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      </g>

      <g id="ear-left">
        <circle cx="126" cy="132" r="8" fill="url(#accentGradient)"/>
      </g>
      <g id="ear-right">
        <circle cx="274" cy="132" r="8" fill="url(#accentGradient)"/>
      </g>
    </g>

  </g>
</svg>
