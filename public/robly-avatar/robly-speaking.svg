<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Robly - speaking">
<defs>
  <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#e4ecfb"/>
  </linearGradient>
  <radialGradient id="headSheen" cx="0.32" cy="0.22" r="0.75">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141b2d"/>
    <stop offset="1" stop-color="#04070d"/>
  </linearGradient>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3b82f6"/>
    <stop offset="1" stop-color="#8b5cf6"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5eead4"/>
    <stop offset="1" stop-color="#38bdf8"/>
  </linearGradient>
  <radialGradient id="sphereGrad" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#bff4ff"/>
    <stop offset="0.45" stop-color="#38bdf8"/>
    <stop offset="1" stop-color="#3b82f6"/>
  </radialGradient>
  <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
    <stop offset="0.7" stop-color="#38bdf8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gloveGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2b3040"/>
    <stop offset="1" stop-color="#12141d"/>
  </linearGradient>
  <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="dropShadow" x="-50%" y="-30%" width="200%" height="200%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.22"/>
  </filter>
</defs>
<style>

.robot-anim{transform-origin:250px 350px;animation:robotFloat 3.2s ease-in-out infinite}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.base-ring{transform-origin:250px 424px;animation:ringPulse 3.2s ease-in-out infinite}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.antenna-halo{transform-origin:250px 36px;animation:haloPulse 2.4s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.25);opacity:1}}
.eyes{transform-origin:250px 190px;animation:blink 4.6s ease-in-out infinite}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}

.robot-anim{animation:speakBob 0.85s ease-in-out infinite}
@keyframes speakBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.bubble{transform-origin:64px 51px;animation:bubbleIn 0.85s ease-in-out infinite}
@keyframes bubbleIn{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .6s ease-in-out infinite}
.b2{animation-delay:-.15s}
.b3{animation-delay:-.3s}
.b4{animation-delay:-.45s}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.arm-l{transform-origin:155px 318px;animation:gestureL 0.85s ease-in-out infinite}
.arm-r{transform-origin:345px 318px;animation:gestureR 0.85s ease-in-out infinite}
@keyframes gestureL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes gestureR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}

</style>

<g class="base-ring ">
      <ellipse cx="250" cy="424" rx="128" ry="30" fill="url(#ringGlow)"/>
      <ellipse cx="250" cy="424" rx="108" ry="15" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" opacity="0.55"/>
      <ellipse cx="250" cy="420" rx="76" ry="9" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
    </g>
<g class="robot-anim">
  <g class="robot">
    <g class="torso-group">
      <rect x="163" y="300" width="174" height="122" rx="50" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
      <rect x="216" y="326" width="68" height="68" rx="18" fill="url(#accentGrad)"/>
      <rect x="216" y="326" width="68" height="24" rx="12" fill="#ffffff" opacity="0.18"/>
      <text x="250" y="374" text-anchor="middle" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="46" font-weight="700" fill="white">R</text>
    </g>
    <g class="antenna">
      
      <rect x="244" y="46" width="12" height="26" rx="6" fill="#2b3040"/>
      <circle cx="250" cy="36" r="20" fill="url(#ringGlow)" class="antenna-halo"/>
      <circle cx="250" cy="36" r="13" fill="url(#sphereGrad)" filter="url(#glow)"/>
      <circle cx="245" cy="31" r="3.6" fill="#ffffff" opacity="0.9"/>
    </g>
    <g class="ears">
      <rect x="85" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
      <rect x="385" y="148" width="30" height="72" rx="15" fill="url(#accentGrad)"/>
      <rect x="91" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
      <rect x="391" y="156" width="8" height="56" rx="4" fill="#ffffff" opacity="0.35"/>
    </g>
    <g class="head-group">
      <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="5" filter="url(#dropShadow)"/>
      <rect x="100" y="66" width="300" height="216" rx="92" fill="url(#headSheen)"/>
      <rect x="132" y="93" width="236" height="160" rx="62" fill="url(#visorGrad)"/>
      <rect x="132" y="93" width="236" height="160" rx="62" fill="none" stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5"/>
      <g class="eyes" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
      <path d="M172 190 Q198 162 224 190"/>
      <path d="M276 190 Q302 162 328 190"/>
    </g>
    </g>
    <g class="arm-l">
      <rect x="134.0" y="318.0" width="42" height="69.4" rx="21.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(131.5 155.0 318.0)"/>
      <rect x="138.3" y="311.5" width="33.4" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(131.5 155.0 318.0)"/>
      <rect x="86.0" y="272.0" width="34" height="65.1" rx="17.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(136.2 103.0 272.0)"/>
      <rect x="89.1" y="265.5" width="27.8" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(136.2 103.0 272.0)"/>
      <g transform="rotate(136.2 58.0 225.0)"><rect x="41.8" y="225.9" width="7.2" height="12.6" rx="3.6" fill="url(#gloveGrad)" transform="rotate(-24 45.4 226.8)"/><rect x="47.2" y="222.3" width="21.6" height="18.0" rx="8.1" fill="url(#gloveGrad)"/><rect x="45.9" y="236.7" width="6.1" height="13.5" rx="3.1" fill="url(#gloveGrad)"/><rect x="54.9" y="236.7" width="6.1" height="15.3" rx="3.1" fill="url(#gloveGrad)"/><rect x="63.9" y="236.7" width="6.1" height="13.5" rx="3.1" fill="url(#gloveGrad)"/></g>
    </g><g class="arm-r">
      <rect x="324.0" y="318.0" width="42" height="69.4" rx="21.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(-131.5 345.0 318.0)"/>
      <rect x="328.3" y="311.5" width="33.4" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(-131.5 345.0 318.0)"/>
      <rect x="380.0" y="272.0" width="34" height="65.1" rx="17.0" fill="url(#bodyGrad)" stroke="#c7d2fe" stroke-width="2" transform="rotate(-136.2 397.0 272.0)"/>
      <rect x="383.1" y="265.5" width="27.8" height="13" rx="6.5" fill="url(#accentGrad)" transform="rotate(-136.2 397.0 272.0)"/>
      <g transform="rotate(-136.2 442.0 225.0)"><rect x="426.5" y="225.9" width="6.9" height="12.0" rx="3.4" fill="url(#gloveGrad)" transform="rotate(-24 430.0 226.7)"/><rect x="431.7" y="222.4" width="20.6" height="17.2" rx="7.7" fill="url(#gloveGrad)"/><rect x="430.5" y="236.2" width="5.8" height="12.9" rx="2.9" fill="url(#gloveGrad)"/><rect x="439.1" y="236.2" width="5.8" height="14.6" rx="2.9" fill="url(#gloveGrad)"/><rect x="447.7" y="236.2" width="5.8" height="12.9" rx="2.9" fill="url(#gloveGrad)"/></g>
    </g>
  </g>
</g>
<g transform="translate(350 296)"><g class="bubble">
  <path d="M4 26 Q -34 -8 -52 -58 Q -6 -6 44 20 Z" fill="#ffffff" stroke="#c7d2fe" stroke-width="3" filter="url(#dropShadow)"/>
  <rect x="0" y="14" width="128" height="72" rx="26" fill="#ffffff" stroke="#c7d2fe" stroke-width="3" filter="url(#dropShadow)"/>
  <g transform="translate(20 34)">
    <rect class="bar" x="0" y="12" width="9" height="26" rx="4.5" fill="url(#accentGrad)"/>
    <rect class="bar b2" x="16" y="4" width="9" height="42" rx="4.5" fill="url(#accentGrad)"/>
    <rect class="bar b3" x="32" y="-2" width="9" height="54" rx="4.5" fill="url(#accentGrad)"/>
    <rect class="bar b4" x="48" y="6" width="9" height="38" rx="4.5" fill="url(#accentGrad)"/>
    <rect class="bar b2" x="64" y="14" width="9" height="22" rx="4.5" fill="url(#accentGrad)"/>
    <rect class="bar b3" x="80" y="8" width="9" height="34" rx="4.5" fill="url(#accentGrad)"/>
  </g>
</g></g>
</svg>