    <rect id="custom-logo-frame" x="161" y="303" width="78" height="78" rx="21" fill="none" stroke="#20E4FF" stroke-width="2.2"/>
    <path d="M168 316 C172 308 182 304 194 304 L172 348 L165 336 Z" fill="#FFFFFF" opacity="0.06"/>
    <image id="custom-logo" href="data:image/png;base64,BASE64_HERE" x="174" y="316" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>
  </g>
</g>

<!-- LEFT ARM (viewer left, relaxed downward) -->
