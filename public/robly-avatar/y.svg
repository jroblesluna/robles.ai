  <path d="M118 325 C116 334 118 343 123 350" fill="none" stroke="#00D9FF" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <ellipse cx="115" cy="330" rx="8" ry="5" fill="#FFFFFF" opacity="0.5"/>
</g>

<!-- LEGS + FEET -->
<g id="legs">
  <rect x="156" y="386" width="30" height="18" rx="10" fill="url(#shellB)" stroke="#C7D0DA" stroke-width="2.4"/>
