<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="fox-title fox-desc" width="400" height="440"> <title id="fox-title">AI Resource Fox Assistant</title> <desc id="fox-desc">Friendly futuristic robotic fox assistant for machine learning and cloud resource management.</desc> <defs> <linearGradient id="shellA" x1="0.18" y1="0.02" x2="0.85" y2="1"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.42" stop-color="#F7F9FC"/> <stop offset="0.72" stop-color="#EEF3F8"/> <stop offset="1" stop-color="#DCE5EE"/> </linearGradient> <linearGradient id="shellB" x1="0.1" y1="0" x2="0.9" y2="1"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.5" stop-color="#F3F6F9"/> <stop offset="1" stop-color="#D7DFE8"/> </linearGradient> <linearGradient id="shellLimb" x1="0" y1="0" x2="1" y2="0.6"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.45" stop-color="#F5F8FB"/> <stop offset="1" stop-color="#D2DCE6"/> </linearGradient> <radialGradient id="shellDome" cx="0.35" cy="0.25" r="0.85"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.45" stop-color="#F6F9FC"/> <stop offset="0.78" stop-color="#E6ECF3"/> <stop offset="1" stop-color="#D2DCE7"/> </radialGradient> <radialGradient id="bodyDome" cx="0.38" cy="0.22" r="0.9"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.42" stop-color="#F6F9FC"/> <stop offset="0.75" stop-color="#E7EDF4"/> <stop offset="1" stop-color="#D3DDE7"/> </radialGradient> <linearGradient id="visorG" x1="0.22" y1="0" x2="0.8" y2="1"> <stop offset="0" stop-color="#1B2A47"/> <stop offset="0.3" stop-color="#16233D"/> <stop offset="0.62" stop-color="#0C182B"/> <stop offset="0.85" stop-color="#07101F"/> <stop offset="1" stop-color="#020712"/> </linearGradient> <linearGradient id="earInG" x1="0.3" y1="0" x2="0.7" y2="1"> <stop offset="0" stop-color="#1A2947"/> <stop offset="0.55" stop-color="#101C32"/> <stop offset="1" stop-color="#020712"/> </linearGradient> <linearGradient id="panelG" x1="0.2" y1="0" x2="0.85" y2="1"> <stop offset="0" stop-color="#1A2A47"/> <stop offset="0.5" stop-color="#101C32"/> <stop offset="1" stop-color="#020712"/> </linearGradient> <radialGradient id="irisG" cx="0.42" cy="0.35" r="0.72"> <stop offset="0" stop-color="#9FFFF6"/> <stop offset="0.35" stop-color="#20E4FF"/> <stop offset="0.72" stop-color="#00D9FF"/> <stop offset="1" stop-color="#0398C4"/> </radialGradient> <radialGradient id="jointG" cx="0.35" cy="0.28" r="0.85"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.55" stop-color="#EFF4F9"/> <stop offset="1" stop-color="#CBD6E1"/> </radialGradient> <radialGradient id="shadowG" cx="0.5" cy="0.5" r="0.5"> <stop offset="0" stop-color="#7B8B9E" stop-opacity="0.42"/> <stop offset="0.55" stop-color="#7B8B9E" stop-opacity="0.18"/> <stop offset="1" stop-color="#7B8B9E" stop-opacity="0"/> </radialGradient> <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5"> <stop offset="0" stop-color="#22E5D0" stop-opacity="0.7"/> <stop offset="0.55" stop-color="#22E5D0" stop-opacity="0.22"/> <stop offset="1" stop-color="#22E5D0" stop-opacity="0"/> </radialGradient> <linearGradient id="glossG" x1="0" y1="0" x2="0.6" y2="1"> <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/> <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/> </linearGradient>

<filter id="blurL" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="blurM" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3.4"/></filter>
<filter id="blurS" x="-90%" y="-90%" width="280%" height="280%"><feGaussianBlur stdDeviation="1.6"/></filter>

<clipPath id="clipVisor"> <path d="M104 168 C104 124 140 100 200 100 C260 100 296 124 296 168 C296 214 259 240 200 240 C141 240 104 214 104 168 Z"/> </clipPath> <clipPath id="clipHead"> <path d="M200 44 C272 44 314 96 314 160 C314 226 271 264 200 264 C129 264 86 226 86 160 C86 96 128 44 200 44 Z"/> </clipPath> <clipPath id="clipBody"> <path d="M200 276 C258 276 288 306 288 348 C288 388 258 408 200 408 C142 408 112 388 112 348 C112 306 142 276 200 276 Z"/> </clipPath> </defs> <style> #mascot{animation:float 3.6s ease-in-out infinite} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}} #arm-right{transform-box:fill-box;transform-origin:24px 18px;animation:wave 2.8s ease-in-out infinite} @keyframes wave{0%,100%{transform:rotate(0deg)}28%{transform:rotate(-8deg)}62%{transform:rotate(6deg)}} #paw-right{transform-box:fill-box;transform-origin:50% 90%;animation:pawflex 2.8s ease-in-out infinite} @keyframes pawflex{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-7deg)}66%{transform:rotate(6deg)}} #arm-left{transform-box:fill-box;transform-origin:26px 18px;animation:armidle 4.6s ease-in-out infinite} @keyframes armidle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(2deg)}} #eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5.4s ease-in-out infinite} @keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(0.07)}97.5%{transform:scaleY(1)}} .eyeglow{animation:eyeglow 3.4s ease-in-out infinite} @keyframes eyeglow{0%,100%{opacity:0.26}50%{opacity:0.48}} #tail{transform-box:fill-box;transform-origin:88% 82%;animation:tailsway 4.4s ease-in-out infinite} @keyframes tailsway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}} #logo-glow{animation:panelbreath 3.6s ease-in-out infinite} @keyframes panelbreath{0%,100%{opacity:0.34}50%{opacity:0.68}} #panel-rim{animation:rimbreath 3.6s ease-in-out infinite} @keyframes rimbreath{0%,100%{opacity:0.5}50%{opacity:0.9}} #halo{transform-box:fill-box;transform-origin:50% 50%;animation:halospin 30s linear infinite} @keyframes halospin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}} #sensor-core{animation:sensorpulse 2.6s ease-in-out infinite} @keyframes sensorpulse{0%,100%{opacity:0.45}50%{opacity:1}} #shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shd 3.6s ease-in-out infinite} @keyframes shd{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.78;transform:scale(0.93)}} @media (prefers-reduced-motion: reduce){ #mascot,#arm-right,#arm-left,#paw-right,#eyes,#tail,#halo,#shadow,#logo-glow,#panel-rim,#sensor-core,.eyeglow{animation:none} } </style> <g id="scene"> <g id="halo" opacity="0.28"> <circle cx="200" cy="212" r="168" fill="none" stroke="#22E5D0" stroke-width="1.4" stroke-dasharray="7 13" opacity="0.6"/> <circle cx="200" cy="212" r="184" fill="none" stroke="#00D9FF" stroke-width="0.9" stroke-dasharray="2 18" opacity="0.45"/> <circle cx="200" cy="44" r="2.6" fill="#22E5D0" opacity="0.75"/> <circle cx="200" cy="380" r="2.2" fill="#00D9FF" opacity="0.6"/> </g> <ellipse id="shadow" cx="200" cy="424" rx="112" ry="15" fill="url(#shadowG)"/> <g id="mascot">
<!-- TAIL — only the tip peeks out at viewer-left, behind the torso -->
