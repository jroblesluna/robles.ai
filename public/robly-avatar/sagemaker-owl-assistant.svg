<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 440" role="img" aria-labelledby="owl-title owl-desc" preserveAspectRatio="xMidYMid meet"> <title id="owl-title">AI Resource Owl Assistant</title> <desc id="owl-desc">Friendly futuristic robotic owl assistant with large glowing digital eyes, articulated robotic wings, and a chest panel reserved for a custom logo.</desc> <defs> <linearGradient id="shellGrad" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.55" stop-color="#F3F6F9"/> <stop offset="1" stop-color="#D7DFE8"/> </linearGradient> <linearGradient id="shellGradSide" x1="0.1" y1="0" x2="0.95" y2="1"> <stop offset="0" stop-color="#FFFFFF"/> <stop offset="0.6" stop-color="#E7ECF2"/> <stop offset="1" stop-color="#C7D0DA"/> </linearGradient> <linearGradient id="shellGradDeep" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#E7ECF2"/> <stop offset="1" stop-color="#AAB6C4"/> </linearGradient> <linearGradient id="visorGrad" x1="0.15" y1="0" x2="0.85" y2="1"> <stop offset="0" stop-color="#16233D"/> <stop offset="0.5" stop-color="#101C32"/> <stop offset="1" stop-color="#020712"/> </linearGradient> <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#22E5D0"/> <stop offset="0.55" stop-color="#00D9FF"/> <stop offset="1" stop-color="#3AD6A0"/> </linearGradient> <linearGradient id="accentGradAlt" x1="0" y1="1" x2="1" y2="0"> <stop offset="0" stop-color="#3AD6A0"/> <stop offset="0.6" stop-color="#22E5D0"/> <stop offset="1" stop-color="#A6FF4D"/> </linearGradient> <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#22E5D0"/> <stop offset="1" stop-color="#3AD6A0"/> </linearGradient> <radialGradient id="irisGrad" cx="0.42" cy="0.36" r="0.72"> <stop offset="0" stop-color="#EAFFFB"/> <stop offset="0.32" stop-color="#22E5D0"/> <stop offset="0.78" stop-color="#00D9FF"/> <stop offset="1" stop-color="#0A8FA8"/> </radialGradient> <radialGradient id="ledGrad" cx="0.5" cy="0.38" r="0.62"> <stop offset="0" stop-color="#F2FFFC"/> <stop offset="0.45" stop-color="#22E5D0"/> <stop offset="1" stop-color="#00D9FF"/> </radialGradient> <radialGradient id="panelGrad" cx="0.5" cy="0.4" r="0.72"> <stop offset="0" stop-color="#16233D"/> <stop offset="0.7" stop-color="#07101F"/> <stop offset="1" stop-color="#020712"/> </radialGradient> <radialGradient id="shadowGrad" cx="0.5" cy="0.5" r="0.5"> <stop offset="0" stop-color="#0B1B2E" stop-opacity="0.34"/> <stop offset="0.58" stop-color="#0B1B2E" stop-opacity="0.15"/> <stop offset="1" stop-color="#0B1B2E" stop-opacity="0"/> </radialGradient> <filter id="glowSoft" x="-90%" y="-90%" width="280%" height="280%"> <feGaussianBlur stdDeviation="4" result="b"/> <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge> </filter> <filter id="glowTiny" x="-70%" y="-70%" width="240%" height="240%"> <feGaussianBlur stdDeviation="2.4" result="b"/> <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge> </filter> <filter id="blurWide" x="-60%" y="-60%" width="220%" height="220%"> <feGaussianBlur stdDeviation="7"/> </filter> </defs> <style> #mascot{animation:floatY 3.6s ease-in-out infinite} #shadow{animation:shadowScale 3.6s ease-in-out infinite} #wing-right{animation:wave 2.8s ease-in-out infinite} #wing-right-tip{animation:tipWave 1.4s ease-in-out infinite} #wing-left{animation:wingIdle 4.6s ease-in-out infinite} #eyes{animation:blink 5.4s linear infinite} #eye-glow-left,#eye-glow-right{animation:eyeLife 3.4s ease-in-out infinite} #eye-glow-right{animation-delay:.2s} #antenna-led{animation:ledPulse 2s ease-in-out infinite} #antenna-led-halo{animation:ledHalo 2s ease-in-out infinite} #halo-ring{animation:spin 11s linear infinite} #logo-glow{animation:panelGlow 3.2s ease-in-out infinite} #custom-logo-background{animation:panelBase 3.2s ease-in-out infinite} #custom-logo-frame{animation:frameGlow 3.2s ease-in-out infinite} .node-pulse{animation:nodeBlink 2.6s ease-in-out infinite} .node-pulse.n2{animation-delay:.45s} .node-pulse.n3{animation-delay:.9s} #mascot,#shadow,#wing-right,#wing-right-tip,#wing-left,#eyes,#eye-glow-left,#eye-glow-right,#antenna-led,#antenna-led-halo,#halo-ring,#logo-glow,#custom-logo-background,#custom-logo-frame,.node-pulse{transform-box:fill-box} #mascot,#shadow,#eyes,#eye-glow-left,#eye-glow-right,#antenna-led,#antenna-led-halo,#halo-ring,#logo-glow,.node-pulse{transform-origin:50% 50%} #wing-right{transform-origin:16% 86%} #wing-right-tip{transform-origin:28% 77%} #wing-left{transform-origin:75% 17%} @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}} @keyframes shadowScale{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.88);opacity:.72}} @keyframes wave{0%,100%{transform:rotate(0deg)}15%{transform:rotate(-10deg)}32%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}68%{transform:rotate(5deg)}84%{transform:rotate(-2deg)}} @keyframes tipWave{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}} @keyframes wingIdle{0%,100%{transform:rotate(0deg)}50%{transform:rotate(3deg)}} @keyframes blink{0%,89%,100%{transform:scaleY(1)}92%{transform:scaleY(.15)}95%{transform:scaleY(1)}} @keyframes eyeLife{0%,100%{opacity:.34}50%{opacity:.6}} @keyframes ledPulse{0%,100%{opacity:.78;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}} @keyframes ledHalo{0%,100%{opacity:.14;transform:scale(.8)}50%{opacity:.48;transform:scale(1.28)}} @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}} @keyframes panelGlow{0%,100%{opacity:.18;transform:scale(.97)}50%{opacity:.44;transform:scale(1.04)}} @keyframes panelBase{0%,100%{stroke-opacity:.35}50%{stroke-opacity:.75}} @keyframes frameGlow{0%,100%{stroke-opacity:.5;stroke-width:2.2}50%{stroke-opacity:1;stroke-width:3}} @keyframes nodeBlink{0%,100%{opacity:.35}50%{opacity:1}} @media (prefers-reduced-motion:reduce){#mascot,#shadow,#wing-right,#wing-righ